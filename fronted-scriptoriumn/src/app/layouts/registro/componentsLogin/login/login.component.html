<mat-card class="login-card">
  <mat-card-title>Iniciar Sesión</mat-card-title>

  <form [formGroup]="loginForm" (ngSubmit)="iniciarSesion()">
    <mat-form-field appearance="fill">
      <mat-label>Usuario</mat-label>
      <input matInput formControlName="usuario" required>
    </mat-form-field>

    <mat-form-field appearance="fill">
      <mat-label>Contraseña</mat-label>
      <input matInput type="password" formControlName="contraseña" required>
    </mat-form-field>

    <button mat-raised-button color="primary" type="submit" [disabled]="loginForm.invalid">
      Entrar
    </button>

    <div class="registro-link">
      ¿No tienes cuenta? <a routerLink="/registro/register">Regístrate aquí</a>
    </div>
  </form>
</mat-card>
