<div class="modal-header">
  <img src="" alt="Logo" class="icono">
  <h2>SCRIPTORIUM</h2>
  <button mat-icon-button (click)="cerrar()">
    <mat-icon>close</mat-icon>
  </button>
</div>

<div class="modal-body">
  <h3>{{ data.titulo }}</h3>
  <p>{{ data.autor }}</p>
  <p><strong>Categoría:</strong> {{ data.generoId || 'Sin categoría' }}</p>

  <button mat-flat-button class="btn-prestamo" color="primary" (click)="abrirAgregarPrestamo()">
    Generar Préstamo
  </button>
</div>
