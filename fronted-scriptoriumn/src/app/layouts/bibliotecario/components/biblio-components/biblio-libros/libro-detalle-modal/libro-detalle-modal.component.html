<div class="modal-header">
  <img src="" alt="Logo" class="icono">
  <h2>SCRIPTORIUM</h2>
  <button mat-icon-button (click)="cerrar()">
    <mat-icon>close</mat-icon>
  </button>
</div>

<div class="modal-body" data-cy="libro-detalle">
  <h3 data-cy="detalle-titulo">{{ data.titulo }}</h3>
  <p data-cy="detalle-autor">{{ data.autor }}</p>
  <p><strong>Categoría:</strong> <span data-cy="detalle-genero">{{ data.generoId || 'Sin categoría' }}</span></p>

  <button mat-flat-button class="btn-prestamo" color="primary" (click)="abrirAgregarPrestamo()" data-cy="btn-generar-prestamo">
    Generar Préstamo
  </button>
</div>
