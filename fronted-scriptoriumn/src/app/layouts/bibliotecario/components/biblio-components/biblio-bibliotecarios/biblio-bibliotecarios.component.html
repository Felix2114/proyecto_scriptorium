<div class="container" style="padding: 20px">
  <h2>Bibliotecarios</h2>
  <table mat-table [dataSource]="bibliotecarios" class="mat-elevation-z8" style="width: 100%; margin-top: 20px">
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef>ID Bibliotecario</th>
      <td mat-cell *matCellDef="let bibliotecarios">
        <ng-container *ngIf="!bibliotecarios.editando; else editUsuario">
          {{ bibliotecarios.id }}
        </ng-container>
        <ng-template #editUsuario>
          <mat-form-field appearance="fill" style="width: 100%">
            <input matInput [(ngModel)]="bibliotecarios.id" name="id-{{ bibliotecarios.id }}" />
          </mat-form-field>
        </ng-template>
      </td>
    </ng-container>

    <ng-container matColumnDef="usuario">
      <th mat-header-cell *matHeaderCellDef>Usuario</th>
      <td mat-cell *matCellDef="let bibliotecarios">
        <ng-container *ngIf="!bibliotecarios.editando; else editUsuario">
          {{ bibliotecarios.usuario }}
        </ng-container>
        <ng-template #editUsuario>
          <mat-form-field appearance="fill" style="width: 100%">
            <input matInput [(ngModel)]="bibliotecarios.usuario" name="usuario{{ bibliotecarios.id }}" />
          </mat-form-field>
        </ng-template>
      </td>
    </ng-container>

    <ng-container matColumnDef="contrasena">
      <th mat-header-cell *matHeaderCellDef>Contraseña</th>
      <td mat-cell *matCellDef="let bibliotecarios">
        <ng-container *ngIf="!bibliotecarios.editando; else editUsuario">
          {{ bibliotecarios.contrasena }}
        </ng-container>
        <ng-template #editUsuario>
          <mat-form-field appearance="fill" style="width: 100%">
            <input matInput [(ngModel)]="bibliotecarios.contrasena" name="contrasena{{ bibliotecarios.id }}" />
          </mat-form-field>
        </ng-template>
      </td>
    </ng-container>



    <ng-container matColumnDef="acciones">
      <th mat-header-cell *matHeaderCellDef>Acciones</th>
      <td mat-cell *matCellDef="let bibliotecarios">
        <button mat-icon-button color="primary" *ngIf="!bibliotecarios.editando"
          (click)="editarBibliotecario(bibliotecarios)">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button color="accent" *ngIf="bibliotecarios.editando"
          (click)="guardarBibliotecario(bibliotecarios)">
          <mat-icon>save</mat-icon>
        </button>
        <button mat-icon-button color="warn" (click)="eliminarBibliotecario(bibliotecarios.id)">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="['id', 'usuario', 'contrasena', 'acciones']"></tr>
    <tr mat-row *matRowDef="let row; let i = index; columns: ['id', 'usuario', 'contrasena', 'acciones']"
      [ngClass]="getRowClass(i)"></tr>
  </table>


  <div style="text-align: center; margin-top: 20px">
    <button mat-raised-button color="primary" (click)="cargarMas()" *ngIf="paginaActual + 1 < totalPaginas">
      Cargar más bibliotecarios
    </button>
  </div>
</div>
